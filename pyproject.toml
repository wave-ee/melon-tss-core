[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melon-tss-core"
version = "0.1.0"
description = "Core segmentation, physical-feature fusion and melon TSS regression modules"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.4,<2.5", "torchvision>=0.19,<0.20", "numpy>=1.24,<2",
  "Pillow>=9", "opencv-python>=4.8,<4.12", "scikit-image>=0.21,<0.26",
  "scikit-learn>=1.3,<1.4"
]

[tool.setuptools.packages.find]
include = ["melon_tss*"]

[tool.setuptools.package-data]
melon_tss = ["physics_feature_names.json"]
